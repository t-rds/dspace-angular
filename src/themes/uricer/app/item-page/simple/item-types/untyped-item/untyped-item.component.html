@if (showBackButton$ | async) {
  <ds-results-back-button [back]="back"></ds-results-back-button>
}
@if (iiifEnabled) {
  <div class="row">
    <div class="col-12">
      <ds-mirador-viewer id="iiif-viewer"
        [object]="object"
        [searchable]="iiifSearchEnabled"
        [query]="iiifQuery$ | async">
      </ds-mirador-viewer>
    </div>
  </div>
}
<div class="d-flex flex-row align-items-center">
  <ds-item-page-title-field [item]="object" class="me-auto mb-2" />
  <ds-dso-edit-menu />
</div>
<div class="row py-2">
  <div class="col-xs-12 col-md-4">
    @if (mediaViewer.image || mediaViewer.video) {
      <div class="mb-2">
        <ds-media-viewer [item]="object" />
      </div>
    }
    <h2 class="header">{{ 'item.page.info' | translate }}</h2>
    <div class="card-container mt-1 mb-3 gap-3">
      <ds-metadata-representation-list class="ds-item-page-mixed-author-field"
        [parentItem]="object"
        [itemType]="'Person'"
        [metadataFields]="['dc.creator', 'dc.contributor.author']"
        [label]="'item.page.authors' | translate" />
      <ds-metadata-representation-list class="ds-item-page-mixed-author-field"
        [parentItem]="object"
        [itemType]="'Person'"
        [metadataFields]="['dc.contributor.advisor', 'dc.contributor.advisorco']"
        [label]="'item.page.advisors' | translate" />
      <ds-metadata-representation-list class="ds-item-page-mixed-author-field"
        [parentItem]="object"
        [itemType]="'Person'"
        [metadataFields]="['dc.contributor.referee']"
        [label]="'item.page.members' | translate" />

      <ds-generic-item-page-field [item]="object"
        [fields]="['dc.publisher']"
        [label]="'item.page.publisher'" />
      <ds-item-page-date-field [item]="object" />
    </div>
  </div>

  <div class="col-xs-12 col-md-8">
    <ds-item-page-attachment-section [item]="object" />
    <ds-item-page-abstract-field [item]="object"
      [fields]="['dc.description', 'dc.description.resumo']" />
    <ds-item-page-abstract-field [item]="object" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.subject']"
      [separator]="';'"
      [label]="'item.page.subject'" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.degree.grantor', 'dc.publisher']"
      [label]="'item.page.publisher'" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.degree.program', 'dc.publisher.program']"
      [label]="'item.page.publisher.program'" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.degree.department', 'dc.publisher.department']"
      [label]="'item.page.publisher.department'" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.identifier.citation']"
      [label]="'item.page.citation'" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.subject.cnpq']"
      [separator]="';'"
      [label]="'item.page.subject.cnpq'" />
    <ds-item-page-uri-field [item]="object"
      [fields]="['dc.identifier.uri']"
      [label]="'item.page.uri'" />
    <ds-item-page-license-field [item]="object" />
    <ds-item-page-collections [item]="object" />

    <div>
      <a class="btn btn-outline-primary" [routerLink]="[itemPageRoute + '/full']" role="button" tabindex="0">
        <i class="fas fa-info-circle"></i> {{"item.page.link.full" | translate}}
      </a>
    </div>
  </div>
</div>

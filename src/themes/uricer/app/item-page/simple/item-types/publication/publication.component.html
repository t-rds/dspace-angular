@if (showBackButton$ | async) {
  <ds-results-back-button [back]="back"></ds-results-back-button>
}
@if (iiifEnabled) {
  <div class="row">
    <div class="col-12">
      <ds-mirador-viewer  id="iiif-viewer"
        [object]="object"
        [searchable]="iiifSearchEnabled"
        [query]="iiifQuery$ | async">
      </ds-mirador-viewer>
    </div>
  </div>
}
<div class="d-flex flex-row">
  <ds-item-page-title-field [item]="object" class="me-auto">
  </ds-item-page-title-field>
  <ds-dso-edit-menu></ds-dso-edit-menu>
</div>
<div class="row">
  <div class="col-12 col-md-4">
    @if (!(mediaViewer.image || mediaViewer.video)) {
      <ds-metadata-field-wrapper [hideIfNoTextContent]="false">
        <ds-thumbnail [thumbnail]="object?.thumbnail | async"></ds-thumbnail>
      </ds-metadata-field-wrapper>
    }
    @if (mediaViewer.image || mediaViewer.video) {
      <div class="mb-2">
        <ds-media-viewer [item]="object"></ds-media-viewer>
      </div>
    }
    <ds-item-page-file-section [item]="object"></ds-item-page-file-section>
    <ds-metadata-representation-list class="ds-item-page-mixed-author-field"
      [parentItem]="object"
      [itemType]="'Person'"
      [metadataFields]="['dc.contributor.author', 'dc.creator']"
      [label]="'item.page.authors' | translate"/>
    <ds-metadata-representation-list class="ds-item-page-mixed-author-field"
      [parentItem]="object"
      [itemType]="'Person'"
      [metadataFields]="['dc.contributor.advisor']"
      [label]="'item.page.advisors' | translate"/>
    <ds-metadata-representation-list class="ds-item-page-mixed-author-field"
      [parentItem]="object"
      [itemType]="'Person'"
      [metadataFields]="['dc.contributor.advisorco']"
      [label]="'item.page.advisorsco' | translate"/>
    <ds-metadata-representation-list class="ds-item-page-mixed-author-field"
      [parentItem]="object"
      [itemType]="'Person'"
      [metadataFields]="['dc.contributor.referee']"
      [label]="'item.page.referees' | translate"/>
    <ds-generic-item-page-field [item]="object"
      [fields]="['journal.title']"
      [label]="'publication.page.journal-title'"/>
    <ds-generic-item-page-field [item]="object"
      [fields]="['journal.identifier.issn']"
      [label]="'publication.page.journal-issn'"/>
    <ds-generic-item-page-field [item]="object"
      [fields]="['journalvolume.identifier.name']"
      [label]="'publication.page.volume-title'"/>
    <ds-item-page-date-field [item]="object"></ds-item-page-date-field>
  </div>
  <div class="col-12 col-md-8">
    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.description', 'dc.description.resumo']"
      [label]="'item.page.resumo'" />
    <ds-item-page-abstract-field [item]="object" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.subject']"
      [separator]="', '"
      [label]="'item.page.subject'" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.degree.grantor', 'dc.publisher']"
      [label]="'item.page.publisher'" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.publisher.program', 'dc.publisher.program']"
      [label]="'item.page.publisher.program'" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.publisher.department', 'dc.publisher.department']"
      [label]="'item.page.publisher.department'" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.publisher.ror']"
      [label]="'item.page.publisher.ror'" />

    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.identifier.citation']"
      [label]="'item.page.citation'" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.subject.cnpq']"
      [separator]="', '"
      [label]="'item.page.subject.cnpq'" />

    <ds-item-page-uri-field [item]="object"
      [fields]="['dc.identifier.uri']"
      [label]="'item.page.uri'">
    </ds-item-page-uri-field>
    <ds-item-page-collections [item]="object"></ds-item-page-collections>
    <ds-item-page-cc-license-field [item]="object" [variant]="'full'" />

    <ds-related-items
      [parentItem]="object"
      [relationType]="'isAuthorOfPublication'"
      [label]="'item.page.authors' | translate">
    </ds-related-items>
    <ds-related-items
      [parentItem]="object"
      [relationType]="'isAdvisorOfPublication'"
      [label]="'item.page.advisors' | translate">
    </ds-related-items>
    <ds-related-items
      [parentItem]="object"
      [relationType]="'isCoAdvisorOfPublication'"
      [label]="'item.page.coadvisors' | translate">
    </ds-related-items>
    <ds-related-items
      [parentItem]="object"
      [relationType]="'isRefereeOfPublication'"
      [label]="'item.page.members' | translate">
    </ds-related-items>
    <ds-related-items
      [parentItem]="object"
      [relationType]="'isOrgUnitOfPublication'"
      [label]="'item.page.org-units' | translate">
    </ds-related-items>
    <div>
      <a class="btn btn-outline-primary" role="button" [routerLink]="[itemPageRoute + '/full']" role="button" tabindex="0">
        <i class="fas fa-info-circle"></i> {{"item.page.link.full" | translate}}
      </a>
    </div>
  </div>
</div>

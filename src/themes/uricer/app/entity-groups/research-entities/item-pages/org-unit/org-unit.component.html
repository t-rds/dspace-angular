@if (showBackButton$ | async) {
  <ds-results-back-button [back]="back" />
}
<div class="d-flex flex-row">
  <ds-item-page-title-field [item]="object" class="me-auto mb-2" />
  <ds-dso-edit-menu />
</div>
<div class="row">
  <div class="col-12 col-md-4">
    <ds-metadata-field-wrapper [hideIfNoTextContent]="false">
      <ds-thumbnail [thumbnail]="object?.thumbnail | async"
        [alt]="'thumbnail.orgunit.alt'"
        [placeholder]="'thumbnail.orgunit.placeholder'" />
    </ds-metadata-field-wrapper>
    <ds-generic-item-page-field [item]="object"
      [fields]="['organization.acronym']"
      [label]="'orgunit.page.acronym'" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['organization.address.addressLocality']"
      [label]="'orgunit.page.city'" />
    @if (homepage) {
      <div class="item-page-field mt-3">
        <h5>{{ 'orgunit.page.url' | translate }}</h5>
        <a [href]="homepage" target="_blank" rel="noopener noreferrer">
          {{ 'orgunit.page.url.link' | translate }}
          <i class="fas fa-external-link-alt ms-1" aria-hidden="true"></i>
        </a>
      </div>
    }
  </div>
  <div class="col-12 col-md-8">
    <ds-generic-item-page-field [item]="object"
      [fields]="['organization.legalName']"
      [label]="'orgunit.page.legalName'" />
    <ds-item-page-img-field
      [fields]="['organization.identifier.ror']"
      [img]="{
        URI: './assets/images/ror-icon.svg',
        alt: 'item.page.image.alt.ROR',
        heightVar: '--ds-item-page-img-field-ror-inline-height'
      }"
      [item]="object"
      [label]="'orgunit.page.ror'"
      [urlRegex]="'(.*)ror.org'"
    />
    <div>
      <a class="btn btn-outline-primary" [routerLink]="[itemPageRoute + '/full']" role="button" tabindex="0">
        {{ "item.page.link.full" | translate }}
      </a>
    </div>
  </div>
  <div class="mt-5 w-100 px-0">
      <ds-tabbed-related-entities-search
        [item]="object"
        [relationTypes]="[
          {
            label: 'isPublicationOfOrgUnit',
            filter: 'isOrgUnitOfPublication',
            configuration: 'publication-relationships'
          },
          {
            label: 'isUndergraduateProgramOfOrgUnit',
            filter: 'isOrgUnitOfUndergraduateProgram',
            configuration: 'undergraduateprogram-relationships'
          },
          {
            label: 'isGraduateProgramOfOrgUnit',
            filter: 'isOrgUnitOfGraduateProgram',
            configuration: 'graduateprogram-relationships'
          }
        ]"
      />
  </div>
</div>

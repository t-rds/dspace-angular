@if (showBackButton$ | async) {
  <ds-results-back-button [back]="back" />
}
<div class="d-flex flex-row">
  <ds-item-page-title-field class="me-auto mb-2" [item]="object" />
  <ds-dso-edit-menu />
</div>
<div class="row">
  <div class="col-12 col-md-4">
    <ds-generic-item-page-field [item]="object"
      [fields]="['organization.name']"
      [label]="'undergraduateprogram.page.name'" />
    <ds-generic-item-page-field [item]="object"
      [fields]="['organization.alternateName']"
      [label]="'undergraduateprogram.page.alternateName'" />
    @if (programUrl) {
      <div class="item-page-field mt-3">
        <h5>{{ 'undergraduateprogram.page.url' | translate }}</h5>
        <a [href]="programUrl" target="_blank" rel="noopener noreferrer">
          {{ 'undergraduateprogram.page.url.link' | translate }}
          <i class="fas fa-external-link-alt ms-1" aria-hidden="true"></i>
        </a>
      </div>
    }
  </div>

  <div class="col-12 col-md-8">
    <ds-related-items
      [parentItem]="object"
      [relationType]="'isOrgUnitOfUndergraduateProgram'"
      [label]="'undergraduateprogram.page.campus' | translate">
    </ds-related-items>
    <ds-generic-item-page-field [item]="object"
      [fields]="['organization.description', 'dc.description', 'dc.description.abstract', 'dc.description.resumo']"
      [label]="'undergraduateprogram.page.description'" />

    <div>
      <a class="btn btn-outline-primary" [routerLink]="[itemPageRoute + '/full']" role="button" tabindex="0">
        <i class="fas fa-info-circle"></i> {{ "item.page.link.full" | translate }}
      </a>
    </div>
  </div>

  <div class="mt-5 w-100 px-0">
    <ds-tabbed-related-entities-search
      [item]="object"
      [relationTypes]="[
        {
          label: 'isPublicationOfUndergraduate',
          filter: 'isUndergraduateOfPublication',
          configuration: 'RELATION.UndergraduateProgram.isPublicationOfUndergraduate'
        }
      ]" />
  </div>
</div>

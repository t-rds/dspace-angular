<div class="p-5 mb-4 bg-light">
  <div class="container mask rounded text-white px-4 py-5">
    @if (homeNewsMetadataValue$ | async; as homeNewsMetadataValue) {
      <ds-markdown-viewer [value]="homeNewsMetadataValue" />
    }
    @else {
        <h1 class="display-4">{{ 'home-news.title' | translate }}</h1>
        <hr class="my-4">
        <p class="lead">{{ 'home-news.lead' | translate }}</p>
        <p class="mb-0 d-none d-sm-block">{{ 'home-news.message' | translate }}</p>
      }
  </div>
</div>

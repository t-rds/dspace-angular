<a [href]="orcidUrl"
   target="_blank"
   rel="noopener noreferrer"
   class="orcid-link">
  <img placement="top"
       [ngbTooltip]="orcidTooltipTemplate"
       class="orcid-icon"
       alt="ORCID {{ orcidTooltip }}"
       src="assets/uricer/images/orcid.logo.icon.svg"
       data-test="orcidIcon"/>
</a>

<ng-template #orcidTooltipTemplate>
  <span class="text-muted">{{ orcidTooltip }}</span>
</ng-template>
